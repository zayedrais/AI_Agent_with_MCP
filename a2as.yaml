variables:
  GROQ_API_KEY:
    type: env
    params:
      caller: [os.getenv, LiteLlm]
      path: [agents.search_agent, agents.coordinator_agent, agents.data_analysis_agent]
  OPENROUTER_API_KEY:
    type: env
    params:
      caller: [os.getenv, LiteLlm]
      path: [tools.code_generator_tool]
  PORT:
    type: env
    params:
      caller: [os.environ.get]
      path: [server]

files:
  file_name:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [self.output_directory, file_name]
  file_path:
    type: variable
    actions: [read, write]
    params:
      caller: [doc.save, open, os.path.basename, os.path.join]
  full_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.isfile, open, os.path.dirname]
  img_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  img_file_name:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [img_dir, img_file_name]
  img_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  metadata_file_name:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [request_folder_path, metadata_file_name]
  metadata_file_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  output_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  req_file_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  request_folder_name:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [self.output_directory, request_folder_name]
  request_folder_path:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]
  requests_log.txt:
    type: literal
    actions: [write, read]
    params:
      caller: [open, os.path.exists]
      alias: [f]
      variable: LOG_FILE
  save_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [self.output_directory, save_path]

networks:
  api.groq.com:
    type: api
    actions: [GET]
    urls: [/openai/v1/chat/completions]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [__init__, _setup_llm_agent]
      links: [api_base]
  openrouter.ai:
    type: api
    actions: [GET]
    urls: [/api/v1]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [__init__]
      links: [api_base]
