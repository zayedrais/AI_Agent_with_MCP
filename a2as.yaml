agents:
  agent.CodeGeneratorTool.code_generation_agent:
    type: class
    models: [self.llm_model]
    params:
      name: code_generation_agent
      description: Generates code snippets with concise explanations
      instruction: [You are a code generation agent that creates high-quality code examples., The user will provide a text
          prompt describing what code they need., 'Your response must include:', 1. A brief explanation (3-5 sentences) of
          what the code does, '2. The code snippet itself, properly formatted', 3. The programming language used for the code,
        'Prefer writing clean, maintainable, and well-commented code. Focus on best practices and include error handling where
          appropriate.', 'Your code should be clear, concise, and complete, implementing the full functionality described
          in the prompt.', 'If the language isn''t specified, choose the most appropriate language for the task.', 'Return
          your response in the following format:', '```json', '{', '"description": "This function reads a CSV file and calculates
          statistics on numeric columns. It handles file not found errors and ignores non-numeric columns automatically.",',
        '"language": "python"', '}', '```']
      input_schema: CodeGenerationInput
      output_key: code_generation_result
      class: CodeGeneratorTool
  agent.DataAnalysisAgent.analysis_agent:
    type: class
    models: [self.groq_model]
    params:
      name: data_analysis
      description: Analyzes data and provides insights with visualization recommendations
      instruction: [You are a data analysis expert that helps analyze datasets and provides meaningful insights., 'Your task
          is to:', 1. Analyze the data summary provided, 2. Determine if visualizations would be valuable for this dataset,
        3. Recommend specific types of visualizations if appropriate, 4. Generate a comprehensive report with key findings
          and recommendations, 'When determining if visualizations are needed and which types to use:', '- Consider the data
          types (numeric, categorical, datetime)', '- Look for relationships that would be clear in visual form', '- Consider
          the number of data points and dimensions', '- Not all data requires visualization - only recommend when it adds
          value', '- If visualization_required is explicitly set to True, always include at least one plot type', 'For the
          report:', '- Be specific and actionable in your recommendations', '- Focus on patterns, trends, anomalies, and potential
          insights', '- Structure your response with clear sections', '- Use professional, concise language appropriate for
          a business report', 'Your analysis should be data-driven and insightful, helping to understand the dataset and identify
          key patterns or issues.']
      input_schema: DataAnalysisInput
      output_schema: DataAnalysisOutput
      output_key: data_analysis_result
      class: DataAnalysisAgent
  agent.SearchAgent.search_agent:
    type: class
    models: [self.groq_model]
    tools: [search]
    params:
      name: search_results_formatter
      description: Formats search results in a clear, readable way.
      instruction: [You are a helpful agent that formats search results., 1. Analyze the search results provided., 2. Provide
          a concise summary of the key information., 3. Ensure accuracy and highlight the most relevant points., '4. Format
          the response in a clear, readable way.']
      output_key: formatted_search_results
      class: SearchAgent
  coordinator:
    type: instance
    models: [self.groq_model]
    params:
      name: agent_routing
      description: Routes user queries to the most appropriate specialized agent
      instruction: [You are a coordinator agent that analyzes user queries and identifies which specialized agent should handle
          the request., 'Currently, you can route to these agents:', 1. search_agent - Performs web searches and provides
          information on any topic, '2. data_analysis_agent - Analyzes data from files (PDF, Excel, Word, CSV) and generates
          reports with visualizations', 3. code_generator_agent - Generates code in various programming languages based on
          natural language descriptions, 'SEARCH AGENT INDICATORS:', '- Information-seeking queries about general topics',
        '- Requests for facts, definitions, or current information', '- Questions about "what is", "how does", "tell me about"',
        '- Simple lookup requests with no need for code examples', '- News, current events, or factual information needs',
        'DATA ANALYSIS AGENT INDICATORS:', '- Requests to analyze data, files, or documents', '- Queries about generating
          reports from data', '- Questions mentioning data formats like Excel, CSV, PDF, or Word', '- Requests for data visualization,
          charts, or graphs', '- Queries about extracting insights or summaries from datasets', 'CODE GENERATOR AGENT INDICATORS:',
        '- Requests to generate, create, or write code', '- Queries about programming solutions or implementations', '- Mentions
          of specific programming languages (Python, JavaScript, etc.)', '- Requests for code examples, functions, or algorithms',
        '- Queries asking how to implement something with code', 'Analyze the user''s query and determine which agent would
          best handle it. Return a JSON object with:', '- agent_name: "search_agent", "data_analysis_agent", or "code_generator_agent"',
        '- confidence_score: How confident you are (0.0-1.0)', '- reasoning: Brief justification for your selection']
      input_schema: CoordinatorInput
      output_schema: AgentRoutingOutput
      output_key: agent_routing_decision
      class: CoordinatorAgent

models:
  self.groq_model:
    type: literal
    agents: [agent.SearchAgent.search_agent, coordinator, agent.DataAnalysisAgent.analysis_agent]
  self.llm_model:
    type: literal
    agents: [agent.CodeGeneratorTool.code_generation_agent]

tools:
  search:
    type: function
    agents: [agent.SearchAgent.search_agent]
    params:
      module: self.search_tool.search
      description: "Search the knowledge base for relevant information\n\nArgs:\n    query: The search query string\n    \n\
        Returns:\n    Dict containing search results or error information"

